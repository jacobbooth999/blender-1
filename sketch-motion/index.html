<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketchbook Motion</title>
<style>
:root{--bg:#1d1b18;--fg:#f3ecdc;--btn:#2c2924;--on:#e4503a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-rounded,system-ui,sans-serif;overflow:hidden}
#wrap{position:absolute;inset:0 0 64px 0;display:flex;align-items:center;justify-content:center;padding:0 16px}
canvas{width:100%;height:auto;max-height:100%;aspect-ratio:16/9;object-fit:contain;display:block}
#ui{position:absolute;left:0;right:0;bottom:12px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 16px}
button{background:var(--btn);color:var(--fg);border:1px solid #4a443c;border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
button.on{background:var(--on);border-color:var(--on)}
body.still #ui{display:none}
body.still #wrap{inset:0;padding:0}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ui"></div>
<script>
// ============================================================================
// Sketchbook Motion — hand-drawn 2D character in a sketchy 3D world.
// Character: 2D rig, ink lines that "boil" every drawing, animated on 12s,
// pose-to-pose with snappy overshoot + smear lines. Background: real 3D
// (perspective camera, painter's sort) rendered as watercolor + pencil + hatching.
// ============================================================================
const W = 1600, H = 900, FPS = 12;
const Q = new URLSearchParams(location.search);
const STILL = Q.has('still');
const DPR = +(Q.get('dpr') || Math.min(2, window.devicePixelRatio || 1));
if (STILL) document.body.classList.add('still');

const cv = document.getElementById('c');
cv.width = W * DPR; cv.height = H * DPR;
const mainCtx = cv.getContext('2d');
const charCv = document.createElement('canvas'); charCv.width = cv.width; charCv.height = cv.height;
const charCtx = charCv.getContext('2d');
let ctx = mainCtx;

// ---------- math ----------
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const lerp = (a, b, p) => a + (b - a) * p, clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]], add = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };
const hex = c => { if (Array.isArray(c)) return c; if (c.startsWith('rgb')) return c.match(/[\d.]+/g).slice(0,3).map(Number); c = c.replace('#',''); return [parseInt(c.slice(0,2),16), parseInt(c.slice(2,4),16), parseInt(c.slice(4,6),16)]; };
const rgba = (a, al = 1) => `rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const mix = (a, b, p) => [lerp(a[0],b[0],p), lerp(a[1],b[1],p), lerp(a[2],b[2],p)];
const shadeRGB = (c, k, cool = 0) => [c[0]*k - cool*14, c[1]*k - cool*4, c[2]*k + cool*16].map(v => clamp(v, 0, 255));
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let BOIL = 0, SC = 0;
const R = () => { SC++; return mulberry(((BOIL + 1) * 73856093) ^ (SC * 19349663)); };

const INK = '#1c1a1e', PENCIL = [61, 52, 44];
const C = { skin:'#f4c7a1', shirt:'#e4503a', pants:'#2e4b7d', shoe:'#2a2522', hair:'#2b1e17' };

// ---------- 2D drawing primitives ----------
function pathPts(p){ ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.closePath(); }
function resample(pts, step){
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++){
    const a = pts[i-1], b = pts[i], d = Math.hypot(b[0]-a[0], b[1]-a[1]), n = Math.max(1, Math.ceil(d / step));
    for (let k = 1; k <= n; k++) out.push([a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n]);
  }
  return out;
}
// Tapered, wobbly brush stroke (filled ribbon).
function inkLine(pts, w, color, o = {}){
  const r = R(), j = o.jit ?? 1, step = o.step ?? 5;
  let p = resample(pts, step); const n = p.length; if (n < 2) return;
  const ph1 = r()*6.28, ph2 = r()*6.28, f1 = 0.12 + r()*0.2, wb = 0.85 + r()*0.3, ta = o.ta ?? 0.25;
  p = p.map((q, i) => [q[0] + Math.sin(i*f1+ph1)*j + (r()-.5)*j*.5, q[1] + Math.sin(i*f1*1.3+ph2)*j + (r()-.5)*j*.5]);
  const L = [], Rr = [];
  for (let i = 0; i < n; i++){
    const a = p[Math.max(0,i-1)], b = p[Math.min(n-1,i+1)];
    let tx = b[0]-a[0], ty = b[1]-a[1]; const d = Math.hypot(tx,ty) || 1; tx /= d; ty /= d;
    const u = i/(n-1);
    const tp = o.flat ? 1 : Math.max(0.12, Math.pow(Math.min(1, u/ta, (1-u)/ta), 0.6));
    const ww = w * wb * tp * (0.82 + 0.36*(0.5+0.5*Math.sin(i*0.23+ph1))) / 2;
    L.push([p[i][0]-ty*ww, p[i][1]+tx*ww]); Rr.push([p[i][0]+ty*ww, p[i][1]-tx*ww]);
  }
  ctx.save(); ctx.globalAlpha = o.a ?? 1; ctx.fillStyle = color;
  pathPts(L.concat(Rr.reverse())); ctx.fill(); ctx.restore();
}
// Filled shape: misregistered colour, cel shade crescent, boiling ink outline that overshoots its start.
function shape(loop, fill, o = {}){
  const r = R(), mis = o.mis ?? [1.8, -1.2], sh = o.sh ?? 3.2;
  const shifted = loop.map(p => [p[0]+mis[0], p[1]+mis[1]]);
  ctx.save();
  pathPts(shifted); ctx.fillStyle = fill; ctx.fill();
  if (o.shade !== false){
    ctx.clip(); ctx.fillStyle = rgba(shadeRGB(hex(fill), 0.74, 0.35)); ctx.fill();
    pathPts(shifted.map(p => [p[0]-sh, p[1]-sh])); ctx.fillStyle = fill; ctx.fill();
  }
  ctx.restore();
  if (o.ink === 0) return;
  const n = loop.length, st = Math.floor(r()*n), ext = Math.ceil(n*0.07);
  const seq = []; for (let i = 0; i <= n + ext; i++) seq.push(loop[(st+i) % n]);
  inkLine(seq, o.ink ?? 2.6, INK, { jit: o.jit ?? 0.7, step: 4, ta: 0.1 });
}
function circlePts(cx, cy, rx, ry = rx, n = 28){ const r = R(), out = []; for (let i = 0; i < n; i++){ const a = i/n*Math.PI*2; const k = 1 + (r()-.5)*0.05; out.push([cx+Math.cos(a)*rx*k, cy+Math.sin(a)*ry*k]); } return out; }
// Outline loop around a variable-width tube following a polyline.
function tubeLoop(pts, ws){
  const p = resample(pts, 4), n = p.length;
  const cum = [0]; for (let i = 1; i < n; i++) cum.push(cum[i-1] + Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]));
  const jc = [0]; for (let i = 1; i < pts.length; i++) jc.push(jc[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  const wAt = s => { for (let i = 1; i < jc.length; i++) if (s <= jc[i] || i === jc.length-1){ const u = clamp((s-jc[i-1])/((jc[i]-jc[i-1])||1),0,1); return lerp(ws[i-1], ws[i], u); } return ws[0]; };
  const L = [], Rr = [], T = [];
  for (let i = 0; i < n; i++){
    const a = p[Math.max(0,i-2)], b = p[Math.min(n-1,i+2)];
    let tx = b[0]-a[0], ty = b[1]-a[1]; const d = Math.hypot(tx,ty) || 1; tx /= d; ty /= d; T.push([tx,ty]);
    const w = wAt(cum[i]) / 2;
    L.push([p[i][0]-ty*w, p[i][1]+tx*w]); Rr.push([p[i][0]+ty*w, p[i][1]-tx*w]);
  }
  const cap = (c, t, w, from) => { const out = [], a0 = Math.atan2(t[1], t[0]); for (let k = 1; k < 6; k++){ const a = a0 + from - k*Math.PI/6; out.push([c[0]+Math.cos(a)*w, c[1]+Math.sin(a)*w]); } return out; };
  const capE = cap(p[n-1], T[n-1], ws[ws.length-1]/2, Math.PI/2);
  const capS = cap(p[0], T[0], ws[0]/2, -Math.PI/2);
  return L.concat(capE, Rr.reverse(), capS);
}
const limb = (pts, ws, fill, o) => shape(tubeLoop(pts, ws), fill, o);
const P2 = (a, d, l) => [a[0] + d[0]*l, a[1] + d[1]*l];

// ---------- character rig ----------
const STAND = { rx:0, air:0, torso:3, head:0, aFu:6, aFl:12, aBu:-6, aBl:12, lFu:4, lFl:-2, lBu:-4, lBl:-2, eye:'dot', mouth:'flat', brow:0 };
const NUM = ['rx','air','torso','head','aFu','aFl','aBu','aBl','lFu','lFl','lBu','lBl','brow','gx','gy','ax'];
const pz = o => ({ ...STAND, ...o });
const EASE = {
  snap: p => { const s = 2.1, q = p - 1; return 1 + (s+1)*q*q*q + s*q*q; }, // fast arrival + overshoot
  out: p => 1 - Math.pow(1-p, 3),
  inout: p => p*p*(3-2*p),
};
function poseAt(sc, t){
  const keys = sc.keys, loop = sc.loop; t = ((t % loop) + loop) % loop;
  let i = keys.length - 1; for (let k = 0; k < keys.length; k++) if (keys[k].t <= t) i = k;
  const cur = keys[i], prev = keys[(i - 1 + keys.length) % keys.length];
  const p = clamp((t - cur.t) / (cur.in || 0.1), 0, 1), e = EASE[cur.ease || 'snap'](p);
  const out = { ...cur.pose };
  for (const k of NUM){ const a = prev.pose[k] ?? 0, b = cur.pose[k] ?? 0; out[k] = a + (b - a)*e; }
  for (const k of ['eye','mouth']) out[k] = p < 0.35 ? prev.pose[k] : cur.pose[k];
  return out;
}
const dn = a => [Math.sin(rad(a)), Math.cos(rad(a))];   // limb angle measured from straight down, + = forward
const up = a => [Math.sin(rad(a)), -Math.cos(rad(a))];  // measured from straight up, + = forward
function fk(o, a, b, l1, l2){ const j = P2(o, dn(a), l1), e = P2(j, dn(a+b), l2); return [o, j, e, a+b]; }
function ik(o, t, l1, l2){
  const dx = t[0]-o[0], dy = t[1]-o[1], d = clamp(Math.hypot(dx,dy), Math.abs(l1-l2)+0.5, l1+l2-0.5), a = Math.atan2(dy,dx);
  const A = Math.acos(clamp((l1*l1 + d*d - l2*l2)/(2*l1*d), -1, 1));
  const j = [o[0]+Math.cos(a+A)*l1, o[1]+Math.sin(a+A)*l1], e = [o[0]+Math.cos(a)*d, o[1]+Math.sin(a)*d];
  return [o, j, e, deg(Math.atan2(e[0]-j[0], e[1]-j[1]))];
}
function solve(P){
  const leg = (a, b) => 46*Math.cos(rad(a)) + 46*Math.cos(rad(a+b));
  const hip = [P.rx || 0, -Math.max(leg(P.lFu,P.lFl), leg(P.lBu,P.lBl)) - (P.air || 0)];
  const td = up(P.torso);
  const neck = P2(hip, td, 70), sh = P2(hip, td, 60), ha = P.torso + P.head, head = P2(neck, up(ha), 27);
  const r = { P, hip, td, neck, sh, ha, head, lF: fk(hip, P.lFu, P.lFl, 46, 46), lB: fk([hip[0]-3, hip[1]], P.lBu, P.lBl, 46, 46) };
  if (P.ik){
    r.grip = [sh[0] + P.gx, sh[1] + P.gy]; r.adir = up(P.ax);
    r.aF = ik(sh, P2(r.grip, r.adir, 13), 36, 34); r.aB = ik(sh, r.grip, 36, 34);
  } else { r.aF = fk(sh, P.aFu, P.aFl, 36, 34); r.aB = fk(sh, P.aBu, P.aBl, 36, 34); }
  return r;
}
function drawArm(a, back){
  const k = back ? 0.8 : 1, shirt = rgba(shadeRGB(hex(C.shirt), k)), skin = rgba(shadeRGB(hex(C.skin), k));
  limb([a[1], a[2]], [10, 9], skin, { ink: 2.3 });
  shape(circlePts(...P2(a[2], dn(a[3]), 3), 7, 7, 14), skin, { ink: 2.2, sh: 2 });
  limb([a[0], a[1]], [15, 12], shirt, { ink: 2.4 });
}
function drawLeg(l, back){
  const k = back ? 0.78 : 1;
  limb([l[0], l[1], l[2]], [20, 16, 13], rgba(shadeRGB(hex(C.pants), k)), { ink: 2.5 });
  const fd = [Math.cos(rad(l[3])), -Math.sin(rad(l[3]))], sd = dn(l[3]);
  const a = P2(P2(l[2], fd, -3), sd, 3), b = P2(P2(l[2], fd, 15), sd, 5);
  limb([a, b], [12, 11], rgba(shadeRGB(hex(C.shoe), back ? 0.9 : 1.2)), { ink: 2.4, sh: 2 });
}
function drawHead(r){
  const P = r.P;
  limb([r.neck, P2(r.neck, up(r.ha), 12)], [11, 11], C.skin, { ink: 2.2 });
  ctx.save(); ctx.translate(r.head[0], r.head[1]); ctx.rotate(rad(r.ha));
  shape(circlePts(23, 2, 4.5, 4.5, 12), C.skin, { ink: 2, shade: false });           // nose
  shape(circlePts(0, 0, 24, 25, 30), C.skin, { ink: 2.8 });                            // head
  ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#ef7d6b'; ctx.beginPath(); ctx.ellipse(8, 8, 6, 4, 0, 0, 7); ctx.fill(); ctx.restore();
  inkLine([[-2,-6],[-8,-2],[-7,5],[-2,5]], 2.2, INK, { jit: .4 });                     // ear
  const hp = []; for (let a = -38; a >= -216; a -= 12) hp.push([Math.cos(rad(a))*28, Math.sin(rad(a))*28 - 1]);
  hp.push([-21, 8], [-15, -4], [-6, -11], [3, -14], [12, -15], [18, -13]);
  shape(hp, C.hair, { ink: 2.4, shade: false, mis: [1, -1] });
  inkLine([[-4,-27],[0,-36],[4,-30]], 2.2, INK, { jit: .5 });                          // cowlick
  const ex = 11, ey = -3;
  if (P.eye === 'wide'){ shape(circlePts(ex+1, ey, 6.5, 7, 14), '#fffaf0', { ink: 2, shade: false }); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ex+3, ey, 2.8, 0, 7); ctx.fill(); }
  else if (P.eye === 'squint') inkLine([[ex-3,ey-6],[ex+3,ey-1],[ex-3,ey+3]], 2.6, INK, { jit: .3, ta: .2 });
  else if (P.eye === 'closed') inkLine([[ex-4,ey+1],[ex,ey-4],[ex+4,ey+1]], 2.6, INK, { jit: .3, ta: .2 });
  else { ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(ex, ey, 3.2, 4, 0, 0, 7); ctx.fill(); }
  const b = P.brow || 0; inkLine([[ex-6, -13 - b*0.3], [ex+5, -12 + b*0.3]], 2.8, INK, { jit: .3 });
  const m = P.mouth;
  if (m === 'smile') inkLine([[8,8],[13,13],[19,8]], 2.4, INK, { jit: .3 });
  else if (m === 'o') shape(circlePts(16, 11, 3.6, 4.2, 10), '#5a1f22', { ink: 2, shade: false });
  else if (m === 'open') shape([[8,7],[20,6],[18,15],[11,16]], '#5a1f22', { ink: 2.2, shade: false });
  else if (m === 'grit'){ shape([[8,7],[19,7],[19,13],[8,13]], '#fffaf0', { ink: 2, shade: false }); inkLine([[8,10],[19,10]], 1.4, INK, { jit: .2, flat: 1 }); }
  else inkLine([[9,10],[18,9]], 2.4, INK, { jit: .3 });
  ctx.restore();
}
function drawTorso(r){
  const a = P2(r.hip, r.td, -6), m = P2(r.hip, r.td, 34), b = P2(r.hip, r.td, 66);
  limb([a, m, b], [34, 38, 28], C.shirt, { ink: 2.8 });
}
function drawCharacter(sc, r, t){
  sc.propsBack && sc.propsBack(r, t);
  drawArm(r.aB, true); drawLeg(r.lB, true); drawLeg(r.lF, false);
  drawTorso(r); drawHead(r);
  sc.propsMid && sc.propsMid(r, t);
  drawArm(r.aF, false);
  sc.propsFront && sc.propsFront(r, t);
}
// Smear / speed lines: trace extremities over the last few in-between frames.
function extremities(sc, r){ const e = [r.aF[2], r.aB[2], r.lF[2], r.lB[2]]; if (sc.extra) e.push(...sc.extra(r)); return e; }
function drawTrails(sc, t){
  const hist = []; for (let k = 0; k <= 5; k++) hist.push(extremities(sc, solve(poseAt(sc, t - k/36))));
  for (let i = 0; i < hist[0].length; i++){
    const ch = hist.map(h => h[i]); let len = 0; for (let k = 1; k < ch.length; k++) len += Math.hypot(ch[k][0]-ch[k-1][0], ch[k][1]-ch[k-1][1]);
    if (len < 30) continue;
    const pts = resample(ch.slice(1), 4); if (pts.length < 3) continue;
    const a = pts[0], b = pts[Math.min(3, pts.length-1)], d = Math.hypot(b[0]-a[0], b[1]-a[1]) || 1, nx = -(b[1]-a[1])/d, ny = (b[0]-a[0])/d;
    const al = clamp((len - 30)/80, 0.35, 0.9);
    for (const off of [-9, 0, 9]){
      const sc2 = 1 - Math.abs(off)/30;
      inkLine(pts.slice(0, Math.max(3, Math.floor(pts.length*sc2))).map(p => [p[0]+nx*off, p[1]+ny*off]), off ? 2.2 : 3.2, INK, { jit: .6, a: al, ta: .45 });
    }
  }
}

// ---------- 3D world ----------
let SUN = norm([-0.5, 0.8, 0.45]);
function makeCam(c){ const f = norm(sub(c.target, c.pos)), r = norm(cross(f, [0,1,0])), u = cross(r, f); return { pos: c.pos, f, r, u, fl: (H/2)/Math.tan(rad(c.fov || 42)/2) }; }
const toCam = (cam, p) => { const d = sub(p, cam.pos); return [dot(d, cam.r), dot(d, cam.u), dot(d, cam.f)]; };
const projC = (cam, q) => [W/2 + cam.fl*q[0]/q[2], H/2 - cam.fl*q[1]/q[2]];
function clipNear(q, n = 0.2){
  const out = [];
  for (let i = 0; i < q.length; i++){ const a = q[i], b = q[(i+1) % q.length], ai = a[2] >= n, bi = b[2] >= n;
    if (ai) out.push(a); if (ai !== bi){ const t = (n - a[2])/(b[2] - a[2]); out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, n]); } }
  return out;
}
// geometry helpers (y up, metres)
const face = (p, c, n, o = {}) => ({ p, c, n, ...o });
function box(x0, y0, z0, x1, y1, z1, c, o = {}){
  const F = [], col = k => o[k] || c;
  F.push(face([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]], col('sx'), [1,0,0], o));
  F.push(face([[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[x0,y0,z0]], col('sx'), [-1,0,0], o));
  F.push(face([[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]], col('top'), [0,1,0], o));
  F.push(face([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]], col('front'), [0,0,1], o));
  F.push(face([[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]], col('back'), [0,0,-1], o));
  return F;
}
const plane = (x0, z0, x1, z1, y, c, o = {}) => face([[x0,y,z0],[x0,y,z1],[x1,y,z1],[x1,y,z0]], c, [0,1,0], { layer: -1, edge: false, ...o });
const rectZ = (x0, y0, x1, y1, z, c, o = {}) => face([[x0,y0,z],[x1,y0,z],[x1,y1,z],[x0,y1,z]], c, [0,0,o.nz || 1], o);
const rectX = (z0, y0, z1, y1, x, c, o = {}) => face([[x,y0,z0],[x,y0,z1],[x,y1,z1],[x,y1,z0]], c, [o.nx || 1,0,0], o);
const discY = (cx, y, cz, r, c, o = {}) => face(Array.from({length: 12}, (_, i) => [cx + Math.cos(i/12*6.283)*r, y, cz + Math.sin(i/12*6.283)*r]), c, [0,1,0], o);
const discZ = (cx, cy, z, r, c, o = {}) => face(Array.from({length: 10}, (_, i) => [cx + Math.cos(i/10*6.283)*r, cy + Math.sin(i/10*6.283)*r, z]), c, [0,0,1], o);
function prism(cx, cz, r, y0, y1, n, c, o = {}){
  const F = [], ring = Array.from({length: n}, (_, i) => i/n*Math.PI*2 + (o.rot || 0));
  for (let i = 0; i < n; i++){ const a = ring[i], b = ring[(i+1) % n], m = (a + b)/2 + (b < a ? Math.PI : 0);

    const gx = x/W*GW, gy = y/H*GH, ix = gx|0, iy = gy|0, fx = gx-ix, fy = gy-iy, G = (i, j) => grid[j*(GW+1)+i];

        shape([[-7*s - 7, -16], [7 - 7, -16], [7 - 7, 16], [-7*s - 7, 16]].map(p => [p[0] + s*7, p[1]]), '#c9955f', { ink: 2.3 });
        ctx.restore();
      }
      if (u < 0.13){ burst([sx, top], 16, 44, 8, '#fff2b0', 7); radLines([sx, top], 48, 80, 9, 2.6, 9); }
    }
  },
  propsMid(r, t){
    const x = this.axe(r);
    limb([x.a, x.b], [7, 7], '#c78f55', { ink: 2.3, sh: 2 });
    const hd = [P2(x.b, x.d, 5), P2(P2(x.b, x.n, 22), x.d, 9), P2(P2(x.b, x.n, 24), x.d, -16), P2(x.b, x.d, -9), P2(P2(x.b, x.n, -8), x.d, -2)];
    shape(hd, '#8a96a3', { ink: 2.6, sh: 2.5 });
    inkLine([P2(P2(x.b, x.n, 22), x.d, 7), P2(P2(x.b, x.n, 24), x.d, -14)], 2, '#eef3f6', { flat: 1, jit: .3 });
  },
  propsFront(r, t){
    const ph = ((t % this.loop) + this.loop) % this.loop, u = ph - 0.97;
    if (u > 0 && u < 0.6){ const rr = mulberry(77);
      for (let i = 0; i < 9; i++){ const vx = (rr() - .5)*700, vy = -300 - rr()*400, x = this.stump[0] + vx*u, y = this.stump[1] + vy*u + 1300*u*u; if (y > -2) continue;
        ctx.save(); ctx.translate(x, y); ctx.rotate(u*12*(rr() - .5)); shape([[-4,-2],[5,-3],[3,3],[-5,2]], '#e2bd86', { ink: 1.6, shade: false, mis: [0,0] }); ctx.restore(); }
    }
  },
});

for (const sc of SCENES){ sc.faces = sc.build(); }

// ---------- frame ----------
function drawFrame(sc, tLive){
  const tq = Math.floor(tLive*FPS + 1e-6)/FPS;   // animate on 12s: every drawing held 2 frames at 24
  BOIL = Math.round(tq*FPS); SC = 0;
  ctx = mainCtx; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  FOG = sc.fog;
  const cam = makeCam(sc.cam(tq));
  drawSky(sc, cam, tq);
  renderWorld(sc.faces, cam, -2);
  renderWorld(sc.faces, cam, -1);
  renderWorld(sc.faces, cam, 0);

  const P = poseAt(sc, tq), rig = solve(P);
  const wp = sc.charPos(tq), feet = toCam(cam, wp), headP = toCam(cam, add(wp, [0, 1.8, 0]));
  const fs = projC(cam, feet), hs = projC(cam, headP), s = (fs[1] - hs[1])/220;
  // contact shadow on the 3D ground
  ctx.save(); ctx.globalAlpha = 0.22*clamp(1 - (P.air || 0)/50, 0.3, 1); ctx.fillStyle = sc.night ? '#0d0b1c' : '#3b2f22';
  ctx.beginPath(); ctx.ellipse(fs[0] + (rig.hip[0])*s*sc.facing, fs[1], 52*s, 9*s, 0, 0, 7); ctx.fill(); ctx.restore();

  ctx = charCtx; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, charCv.width, charCv.height);
  ctx.setTransform(DPR*s*sc.facing, 0, 0, DPR*s, DPR*fs[0], DPR*fs[1]);
  drawTrails(sc, tq);
  drawCharacter(sc, rig, tq);
  ctx = mainCtx; ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (sc.night){ ctx.save(); ctx.filter = `drop-shadow(0 0 ${5*DPR}px rgba(255,214,150,.75))`; ctx.drawImage(charCv, 0, 0); ctx.restore(); }
  else ctx.drawImage(charCv, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  renderWorld(sc.faces, cam, 1);
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(paper, 0, 0, W, H); ctx.restore();
}

// ---------- playback / UI ----------
let cur = +(Q.get('scene') || 0), playing = true, auto = !Q.has('scene'), t0 = performance.now(), tPause = 0;
if (STILL){
  const sc = SCENES[cur]; drawFrame(sc, Q.has('t') ? +Q.get('t') : sc.stillT);
  document.title = 'ready';
} else {
  const ui = document.getElementById('ui'), btns = [];
  SCENES.forEach((sc, i) => { const b = document.createElement('button'); b.textContent = `${i+1}. ${sc.name}`; b.onclick = () => { cur = i; auto = false; t0 = performance.now(); sync(); }; ui.appendChild(b); btns.push(b); });
  const ab = document.createElement('button'); ab.textContent = 'Auto-cycle'; ab.onclick = () => { auto = !auto; t0 = performance.now(); sync(); }; ui.appendChild(ab);
  const pb = document.createElement('button'); pb.textContent = 'Pause'; pb.onclick = () => { playing = !playing; if (playing) t0 = performance.now() - tPause*1000; pb.textContent = playing ? 'Pause' : 'Play'; }; ui.appendChild(pb);
  const sync = () => { btns.forEach((b, i) => b.classList.toggle('on', i === cur)); ab.classList.toggle('on', auto); };
  sync();
  let lastDrawn = -1;
  (function loop(){
    if (playing){
      tPause = (performance.now() - t0)/1000;
      if (auto && tPause > SCENES[cur].dur){ cur = (cur + 1) % SCENES.length; t0 = performance.now(); tPause = 0; sync(); }
    }
    const f = Math.floor(tPause*FPS);
    if (f !== lastDrawn){ lastDrawn = f; drawFrame(SCENES[cur], tPause); }
    requestAnimationFrame(loop);
  })();
}
</script>
