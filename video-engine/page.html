<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&family=Special+Elite&family=Oswald:wght@500;700&family=Permanent+Marker&display=block" rel="stylesheet">
<script src="timeline.js"></script>
<script src="maps.js"></script>
<script src="credits.js"></script>
<script src="footage.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#111}
#stage{position:absolute;inset:0;overflow:hidden;perspective:2600px}
#world{position:absolute;left:960px;top:540px;width:0;height:0;transform-style:preserve-3d}
#desk{position:absolute;background:#262a33 url(desk.jpg);background-size:1200px}
.card{position:absolute;transform-origin:50% 50%;will-change:transform}
.sheet{position:relative;background:#eee6d4 url(paper.jpg);background-size:900px;color:#161412;padding:44px 50px 52px;font-family:'Old Standard TT',serif}
.sheet::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.15),rgba(90,70,40,.18) 95%);pointer-events:none;mix-blend-mode:multiply}
.torn{clip-path:polygon(0 1.5%,6% 0,13% 1.2%,21% .2%,29% 1.4%,37% .3%,45% 1.1%,53% 0,61% 1.3%,69% .2%,77% 1%,85% 0,93% 1.2%,100% .4%,99.2% 12%,100% 25%,99.4% 38%,100% 52%,99.3% 66%,100% 80%,99.5% 92%,100% 99%,92% 100%,84% 98.8%,76% 100%,68% 98.9%,60% 99.8%,52% 98.7%,44% 100%,36% 98.9%,28% 99.9%,20% 98.8%,12% 100%,5% 99%,0 100%,.6% 88%,0 74%,.7% 60%,0 46%,.5% 32%,0 18%)}
.txt{color:rgba(22,20,18,var(--ink,1))}
.mast{font-family:'UnifrakturMaguntia',serif;font-size:66px;text-align:center;line-height:1}
.rule{border-top:3px double #1a1714;border-bottom:1px solid #1a1714;height:7px;margin:12px 0 8px}
.dateline{display:flex;justify-content:space-between;font-size:18px;letter-spacing:1px;text-transform:uppercase}
.hed{font-family:'Playfair Display',serif;font-weight:900;line-height:.98;letter-spacing:-1px}
.dek{font-family:'Playfair Display',serif;font-style:italic;font-size:34px;line-height:1.2;margin:14px 0 18px}
.body{font-size:30px;line-height:1.4;text-align:justify;hyphens:auto}
.body p{margin-bottom:12px}
.kicker{font-family:'Oswald';font-weight:700;letter-spacing:3px;font-size:24px;text-transform:uppercase;color:#a3221b}
.hl{--p:0;color:#111!important;background-image:linear-gradient(100deg,rgba(255,226,60,0) 0,rgba(255,222,40,.95) 1%,rgba(255,214,30,.92) 99%,rgba(255,226,60,0) 100%);background-repeat:no-repeat;background-size:calc(var(--p)*100%) 78%;background-position:0 65%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 4px}
.photo{position:relative;overflow:hidden;background:#3a3631;background-size:cover;background-repeat:no-repeat;filter:grayscale(1) contrast(1.2) brightness(1.04) sepia(.16)}
.photo::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(20,18,16,.55) 30%,transparent 34%);background-size:5px 5px;mix-blend-mode:multiply;opacity:.3}
.cap{font-size:17px;font-style:italic;margin:6px 0 14px;color:#4a443c;line-height:1.3}
.stamp{font-family:'Special Elite';color:#b0201a;border:5px solid #b0201a;padding:6px 18px;display:inline-block;font-size:40px;letter-spacing:4px;transform:rotate(-6deg);opacity:.85;white-space:nowrap}
.typed{font-family:'Special Elite';font-size:36px;line-height:1.45}
.row{display:flex;gap:26px;align-items:baseline;border-bottom:1px dashed #8d826d;padding:16px 0}
.row .lab{font-family:'Oswald';font-weight:700;font-size:40px;color:#2b2723;min-width:190px}
.statrow{display:flex;align-items:center;gap:30px;padding:10px 0;flex-wrap:wrap;row-gap:0}
.statrow .num{font-family:'Playfair Display';font-weight:900;font-size:190px;line-height:.95;color:#161412;white-space:nowrap}
.statrow .lbl{font-family:'Oswald';font-weight:700;font-size:44px;letter-spacing:2px;line-height:1.05}
.quote-big{font-family:'Playfair Display';font-style:italic;font-weight:700;font-size:96px;line-height:1.05;text-align:center;margin:26px 0 12px}
.quote-big .w{opacity:0;display:inline-block;transform:translateY(20px)}
.marker{font-family:'Permanent Marker',cursive;color:#c8231b}
.polaroid{position:absolute;background:#f7f4ec;padding:16px 16px 64px;box-shadow:0 14px 26px rgba(0,0,0,.55);z-index:5}
.polaroid .img{width:100%;height:100%;background-size:cover;filter:contrast(1.08) saturate(.85) sepia(.12)}
.polaroid .pc{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:'Permanent Marker';font-size:30px;color:#222}
.chapter .sheet{background:#1b1a19;color:#f1ead9}
.chapter .sheet::after{background:radial-gradient(ellipse at 40% 30%,rgba(255,255,255,.08),rgba(0,0,0,.35) 95%);mix-blend-mode:normal}
svg.draw path{fill:none;stroke:#c8231b;stroke-linecap:round;stroke-linejoin:round}
#caps{position:absolute;left:0;right:0;bottom:70px;text-align:center;pointer-events:none;font-family:'Oswald';font-weight:700;font-size:68px;letter-spacing:1px;text-transform:uppercase;color:#fff;
  -webkit-text-stroke:10px #111;paint-order:stroke fill;text-shadow:0 6px 18px rgba(0,0,0,.6)}
#caps span{display:inline-block;margin:0 10px;transition:none}
#caps span.k{color:#ffd61e}
#chlabel{position:absolute;left:46px;top:40px;font-family:'Oswald';font-weight:700;font-size:26px;letter-spacing:3px;color:#f1ead9;background:#1b1a19;padding:8px 18px 8px 16px;text-transform:uppercase;box-shadow:0 6px 14px rgba(0,0,0,.5);opacity:0}
#chlabel b{color:#ffd61e;margin-right:12px}
#foot{position:absolute;inset:0;overflow:hidden;opacity:0;background:#000}
#footimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%;filter:contrast(1.08) saturate(1.05)}
#footcap{position:absolute;left:46px;top:96px;max-width:980px;background:#eee6d4 url(paper.jpg);background-size:700px;padding:14px 22px 16px;box-shadow:0 12px 26px rgba(0,0,0,.6);transform:rotate(-1.5deg);clip-path:polygon(0 4%,8% 0,20% 3%,35% 0,50% 3%,65% 0,80% 3%,92% 0,100% 4%,99% 50%,100% 96%,90% 100%,75% 97%,60% 100%,45% 97%,30% 100%,15% 97%,0 100%,1% 50%)}
#footcap .k{font-family:'Oswald';font-weight:700;letter-spacing:3px;font-size:28px;color:#a3221b;text-transform:uppercase}
#footcap .c{font-family:'Playfair Display';font-weight:700;font-size:56px;color:#161412;line-height:1.1;margin-top:2px}
#footcap .cr{font-family:'Old Standard TT';font-style:italic;font-size:18px;color:#4a443c;margin-top:4px}
.phv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#grain{position:absolute;inset:0;background-size:1920px 1080px;mix-blend-mode:overlay;opacity:.2;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 100%);pointer-events:none}
#flicker{position:absolute;inset:0;background:#fff3d8;mix-blend-mode:soft-light;pointer-events:none;opacity:0}
#flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
</style></head><body>
<div id="stage"><div id="world"><div id="desk"></div></div>
<div id="foot"><img id="footimg"><div id="footcap"><div class="k"></div><div class="c"></div></div></div><div id="flicker"></div><div id="vig"></div><div id="grain"></div><div id="flash"></div><div id="chlabel"></div><div id="caps"></div></div>
<script>
const TL=window.TL,ST=window.STORY,S=TL.scenes,W=1920,H=1080;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const ease=x=>{x=clamp(x);return x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2},easeOut=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const rnd=(i,k)=>{const s=Math.sin(i*127.1+k*311.7)*43758.5453;return s-Math.floor(s)};
const MD=s=>(s||'').replace(/\[\[(\w+)\|([^\]]+)\]\]/g,(m,id,t)=>`<span class="hl" data-hl="${id}">${t}</span>`);
const imgurl=src=>`img/${src}.jpg`;
const world=document.getElementById('world');
// ---------- builders ----------
function photoHTML(p,h,extra=''){if(!p)return'';const cr=(window.CREDITS||{})[p.src]||'';
 return `<div class="photo ph" ${p.video?`data-video="${p.video}"`:''} style="height:${h}px;background-image:url(${imgurl(p.src)});background-position:${p.pos||'50% 30%'};${p.size?'background-size:'+p.size:''};${extra}">${p.video?`<img class="phv" style="object-position:${p.vpos||'50% 50%'}">`:''}</div>${p.cap!==undefined||cr?`<div class="cap">${p.cap||''} ${cr?'Photo: '+cr:''}</div>`:''}`;}
const B={
 front:(s,i)=>`<div class="sheet torn txt" style="width:1180px"><div class="mast">${ST.masthead||"The Matchday Chronicle"}</div><div class="rule"></div>
  <div class="dateline"><span>${s.date}</span><span>${s.place}</span><span>Archive</span></div><div class="rule"></div>
  <div class="kicker" style="margin-top:14px">${s.kicker}</div><div class="hed" style="font-size:120px;margin-top:6px">${s.hed}</div>
  <div class="dek">${MD(s.dek)}</div>${s.photo?`<div style="display:flex;gap:34px"><div style="flex:1.1">${photoHTML(s.photo,430)}</div><div class="body" style="flex:1">${s.body.map(b=>`<p>${MD(b)}</p>`).join('')}</div></div>`:`<div class="body" style="column-count:2;column-gap:40px;font-size:34px">${s.body.map(b=>`<p>${MD(b)}</p>`).join('')}</div>`}</div>`,
 clip:(s,i)=>`<div class="sheet torn txt" style="width:1180px"><div class="kicker">${s.kicker}</div><div class="hed" style="font-size:${s.hed.length>18?96:118}px;margin:8px 0 6px">${s.hed}</div><div class="rule"></div>
  <div style="display:flex;gap:36px;margin-top:16px;align-items:flex-start">${s.photo?`<div style="flex:1.05">${photoHTML(s.photo,470)}</div>`:''}
  <div class="body" style="flex:1;font-size:36px">${s.body.map(b=>`<p>${MD(b)}</p>`).join('')}</div></div></div>`,
 file:(s,i)=>`<div class="sheet txt" style="width:1160px;padding-top:40px"><div style="display:flex;justify-content:space-between;align-items:center"><div class="hed" style="font-size:66px">${s.title}</div><div class="stamp">${s.stamp}</div></div>
  <div class="rule"></div><div class="typed">${s.rows.map((r,k)=>`<div class="row" ${k==s.rows.length-1?'style="border:0"':''}><span class="lab">${r[0]}</span><span>${MD(r[1])}</span></div>`).join('')}</div></div>`,
 stat:(s,i)=>`<div class="sheet torn txt" style="width:1240px;padding:50px 60px 56px"><div class="kicker">${s.kicker}</div>
  <div style="display:flex;gap:40px;align-items:center;margin-top:10px">${s.photo?`<div style="width:430px;flex:none">${photoHTML(s.photo,520)}</div>`:''}
  <div style="flex:1">${s.rows.map(r=>`<div class="statrow" id="${r.id}" data-num="${r.num}" data-pre="${r.prefix||''}" data-suf="${r.suffix||''}"><span class="num">${r.prefix||''}0${r.suffix||''}</span><span class="lbl">${r.label}</span></div>`).join('')}
  ${s.foot?`<div class="body" style="font-size:40px;margin-top:16px">${MD(s.foot)}</div>`:''}</div></div></div>`,
 quote:(s,i)=>`<div class="sheet torn txt" style="width:1260px;padding:70px 80px 80px;text-align:center"><div class="body" style="font-size:44px;text-align:center">${MD(s.pre)}</div>
  <div class="quote-big" data-qt>${s.text.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ')}</div>
  <svg class="draw qline" viewBox="0 0 600 30" preserveAspectRatio="none" style="width:70%;height:30px;display:block;margin:0 auto"><path d="M5 20 C 150 8, 420 26, 595 12" stroke-width="7"/></svg>
  ${s.by?`<div class="kicker" style="margin-top:18px;color:#4a443c">— ${s.by}</div>`:''}</div>`,
 title:(s,i)=>`<div class="sheet torn txt" style="width:1400px;padding:70px 80px 90px;text-align:center"><div class="mast" style="font-size:52px">${ST.masthead||"The Matchday Chronicle"}</div><div class="rule"></div>
  <div class="hed" style="font-size:150px;margin-top:30px">${s.line1}</div><div class="hed" style="font-size:96px;margin-top:6px;font-style:italic;font-weight:700">${s.line2}</div>
  <div style="position:relative;display:inline-block;margin-top:${s.icon=='none'?20:120}px">${s.icon=='none'?'':'<svg viewBox="0 0 200 120" style="position:absolute;left:50%;top:-128px;width:200px;margin-left:-100px"><path d="M20 105 L10 30 L60 70 L100 10 L140 70 L190 30 L180 105 Z" fill="#d9a520" stroke="#161412" stroke-width="7" stroke-linejoin="round"/><circle cx="100" cy="10" r="9" fill="#161412"/></svg>'}
  <span class="hed kingword" style="font-size:230px;letter-spacing:6px">${s.line3}</span>
  ${s.mark=='underline'?'<svg class="draw xmark" viewBox="0 0 400 40" style="position:absolute;left:-20px;bottom:-30px;width:calc(100% + 40px);height:50px;overflow:visible" preserveAspectRatio="none"><path d="M5 25 C 120 8, 280 34, 395 14" stroke-width="12"/></svg>':'<svg class="draw xmark" viewBox="0 0 400 300" style="position:absolute;left:-40px;top:-150px;width:calc(100% + 80px);height:calc(100% + 170px);overflow:visible" preserveAspectRatio="none"><path d="M20 30 L380 280" stroke-width="16"/><path d="M380 30 L20 280" stroke-width="16"/></svg>'}</div></div>`,
 chapter:(s,i)=>`<div class="sheet torn" style="width:1100px;padding:80px 70px 90px;text-align:center"><div style="font-family:'Oswald';font-weight:700;letter-spacing:12px;font-size:34px;color:#ffd61e">CHAPTER</div>
  <div style="font-family:'UnifrakturMaguntia';font-size:220px;line-height:1">${s.num}</div><div class="hed" style="font-size:96px;color:#f1ead9">${s.title}</div></div>`,
 map:(s,i)=>{const m=MAPS[i];const SE=Object.values(m.stops);const st=Object.entries(m.stops).map(([k,p])=>{const left=SE.some(o=>o!==p&&o.x>p.x&&o.x-p.x<300&&Math.abs(o.y-p.y)<60);return `<g class="stop" data-k="${k}"><circle cx="${p.x}" cy="${p.y}" r="13" fill="#c8231b" stroke="#fff" stroke-width="4"/><text x="${left?p.x-20:p.x+20}" text-anchor="${left?'end':'start'}" y="${p.y-18}" font-family="Oswald" font-weight="700" font-size="34" fill="#161412" stroke="#eee6d4" stroke-width="8" paint-order="stroke">${p.name}</text></g>`}).join('');
  const legs=m.legs.map(l=>{const a=m.stops[l.from],b=m.stops[l.to];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2-Math.hypot(b.x-a.x,b.y-a.y)*.25;
   return `<path class="leg" data-cue="${l.cue}" d="M${a.x} ${a.y} Q${mx} ${my} ${b.x} ${b.y}" fill="none" stroke="#c8231b" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 1"/>`}).join('');
  return `${s.photo?`<div class="polaroid" style="width:300px;height:390px;right:-90px;top:-150px;transform:rotate(7deg)"><div class="img" style="background-image:url(${imgurl(s.photo.src)});background-position:${s.photo.pos}"></div><div class="pc">${s.photo.pc||''}</div></div>`:''}<div class="sheet txt" style="width:1340px;padding:40px 50px 46px"><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="hed" style="font-size:60px">The Journey</div><div class="body" style="font-size:36px">${MD(s.note)}</div></div><div class="rule"></div>
  <svg viewBox="0 0 ${m.w} ${m.h}" style="width:${m.w}px;height:${m.h}px;display:block;background:#efe5cc"><defs><pattern id="ht${i}" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="2.3" fill="#6d6455"/></pattern></defs>
  ${m.mode=='land'?`<rect width="${m.w}" height="${m.h}" fill="#8fa5a6"/><path d="${m.land}" fill="#efe5cc" stroke="#3b352e" stroke-width="2.5"/><path d="${m.land}" fill="url(#ht${i})" opacity=".25"/>`:`<rect width="${m.w}" height="${m.h}" fill="url(#ht${i})" opacity=".25"/><path d="${m.land}" fill="#8fa5a6" fill-rule="evenodd" stroke="#3b352e" stroke-width="2.5"/>`}<path d="${m.grat}" stroke="#6f8584" stroke-width="1.5" fill="none" opacity=".5"/>${legs}${st}</svg></div>`;},
 verdict:(s,i)=>`<div class="sheet torn txt" style="width:1300px;padding:60px 70px 70px;text-align:center;position:relative">
  ${s.photo?`<div class="polaroid" style="width:300px;height:390px;left:-120px;top:-120px;transform:rotate(-8deg)"><div class="img" style="background-image:url(${imgurl(s.photo.src)});background-position:${s.photo.pos}"></div><div class="pc">${s.photo.pc||""}</div></div>`:''}
  <div class="mast" style="font-size:46px">${ST.masthead||"The Matchday Chronicle"}</div><div class="rule"></div><div class="hed" style="font-size:130px;margin-top:24px"><span class="hl" data-hl="q0">${s.q}</span></div>
  <div style="display:flex;justify-content:center;gap:120px;margin-top:44px;font-family:'Oswald';font-weight:700;font-size:72px">${s.opts.map(o=>`<span>${o} <span style="display:inline-block;width:66px;height:66px;border:6px solid #161412;vertical-align:-8px"></span></span>`).join('')}</div>
  <div class="marker" style="font-size:64px;margin-top:44px;transform:rotate(-2deg)"><span class="hl" data-hl="cta" style="color:#c8231b!important">${s.cta}</span></div></div>`
};
// ---------- layout ----------
const cards=[];let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
ST.scenes.forEach((s,i)=>{const el=document.createElement('div');el.className='card '+s.type;el.innerHTML=B[s.type](s,i);world.appendChild(el);
 const col=i%4,row=Math.floor(i/4),c=row%2?3-col:col;
 const x=c*1750+(rnd(i,1)-.5)*160,y=row*1350+(rnd(i,2)-.5)*140,r=(rnd(i,3)-.5)*7*(s.type=='map'||s.type=='title'?.4:1);
 cards.push({el,s,i,x,y,r});el.style.zIndex=10+i;});
function measure(){for(const c of cards){c.w=c.el.offsetWidth;c.h=c.el.offsetHeight;c.el.style.left=(c.x-c.w/2)+'px';c.el.style.top=(c.y-c.h/2)+'px';
 minx=Math.min(minx,c.x-c.w);maxx=Math.max(maxx,c.x+c.w);miny=Math.min(miny,c.y-c.h);maxy=Math.max(maxy,c.y+c.h);}
 const d=document.getElementById('desk');d.style.left=(minx-2500)+'px';d.style.top=(miny-2500)+'px';d.style.width=(maxx-minx+5000)+'px';d.style.height=(maxy-miny+5000)+'px';}
function local(el,c){// element center in world coords
 const cr=c.el.getBoundingClientRect(),rs=[...el.getClientRects()];let l=1e9,t=1e9,r=-1e9,b=-1e9;for(const q of rs){l=Math.min(l,q.left);t=Math.min(t,q.top);r=Math.max(r,q.right);b=Math.max(b,q.bottom);}
 if(!rs.length){const q=el.getBoundingClientRect();l=q.left;t=q.top;r=q.right;b=q.bottom;}
 const lx=(l+r)/2-cr.left-c.w/2,ly=(t+b)/2-cr.top-c.h/2,a=c.r*Math.PI/180;return {x:c.x+lx*Math.cos(a)-ly*Math.sin(a),y:c.y+lx*Math.sin(a)+ly*Math.cos(a),w:r-l,h:b-t};}
// ---------- camera keys ----------
let keys=[];
function fitPose(c){const vh=Math.min(c.h,1080);const z=Math.min(1700/c.w,960/vh);const a=c.r*Math.PI/180,ly=c.h>1080?-(c.h-vh)/2:0;
 return {x:c.x-ly*Math.sin(a),y:c.y+ly*Math.cos(a),z,r:-c.r*.6};}
function build(){
 keys=[];
 cards.forEach((c,i)=>{const sc=S[i],st0=sc.start;c.t0=st0;const fd=(c.s.footage?c.s.footage.dur:0);const st=st0+fd;c.tv=st;
  const f=fitPose(c);keys.push({t:i?(fd?st-.05:st):-1,...f,d:i?(fd?.01:.55):.01});
  // cue targets
  const cueEls=[];
  c.el.querySelectorAll('[data-hl]').forEach(e=>{const k=e.dataset.hl;if(sc.cues[k]!==undefined)cueEls.push({t:sc.cues[k],el:e,k});});
  c.el.querySelectorAll('.statrow').forEach(e=>{if(sc.cues[e.id]!==undefined)cueEls.push({t:sc.cues[e.id],el:e,k:e.id,stat:1});});
  if(c.s.type=='quote'&&sc.cues.qt!==undefined)cueEls.push({t:sc.cues.qt,el:c.el.querySelector('[data-qt]'),k:'qt',wide:1});
  c.cueEls=cueEls.sort((a,b)=>a.t-b.t);
  // full-bleed photo moment
  const ph=c.el.querySelector('.ph');const first=cueEls.length?cueEls[0].t:sc.vo+sc.dur;
  const phUrl=c.s.photo?imgurl(c.s.photo.src):'';if(ph&&first-st>2.0&&(NAT[phUrl]||0)>=900){const p=local(ph,c);keys.push({t:st+.75,x:p.x,y:p.y,z:Math.min(1920/p.w,1080/p.h)*1.04,r:-c.r,d:.45,kb:1});}
  for(const ce of cueEls){if(c.s.type=='map'||c.s.type=='chapter'||c.s.type=='title')continue;
   const p=local(ce.el,c);let z=clamp(1250/Math.max(p.w,200),f.z*1.12,ce.stat?1.5:2.0);if(ce.wide)z=clamp(1650/p.w,f.z,1.6);
   keys.push({t:Math.max(ce.t-.32,st+.35),x:p.x,y:p.y,z,r:-c.r*.4+(rnd(i,ce.t)-.5)*2,d:.32});}
  if(c.s.type=='verdict'){keys.push({t:sc.cues.cta_end+.6,x:c.x,y:c.y+120,z:.66,r:-1,d:2.2});}
 });
 keys.sort((a,b)=>a.t-b.t);
}
function camPose(t){let pose={x:keys[0].x,y:keys[0].y,z:keys[0].z,r:keys[0].r};
 for(let i=1;i<keys.length;i++){const k=keys[i],nt=i+1<keys.length?keys[i+1].t:1e9;if(t<k.t)break;
  const te=Math.min(t,nt),u=ease((te-k.t)/k.d),f={...pose};pose={x:lerp(f.x,k.x,u),y:lerp(f.y,k.y,u),z:lerp(f.z,k.z,u),r:lerp(f.r,k.r,u)};
  const hold=Math.max(0,te-k.t-k.d);pose.z*=1+(k.kb?.05:.012)*hold;pose.r+=.18*hold;pose.moving=u<1?Math.abs(k.d<.4?1:0):0;}

// ---------- captions ----------
const caps=document.getElementById('caps');let groups=[];
function buildCaps(){const ws=TL.words;let g=[];const keyset=new Set();
 S.forEach((sc,i)=>{const st=ST.scenes[i];const ph=Object.values(st.cues||{}).concat((st.rows||[]).map(r=>r.cue||''),(st.legs||[]).map(l=>l[2]));
  const stop=new Set(['the','and','a','of','in','to','for','his','he','it','on','at','by','an','was']);ph.forEach(p=>p.toLowerCase().split(/\s+/).forEach(w=>{w=w.replace(/[^\wÀ-ÿ']/g,'');if(!stop.has(w))keyset.add(i+':'+w);}));});
 for(let j=0;j<ws.length;j++){const w=ws[j];g.push(w);const end=/[.?!,]$/.test(w.w)||g.length>=3||j==ws.length-1||ws[j+1].scene!=w.scene||ws[j+1].s-w.e>.25;
  if(end){groups.push(g);g=[];}}

let lastG=-1;

 if(gi!==lastG){lastG=gi;caps.innerHTML=gi<0?'':groups[gi].map(w=>`<span class="${w.k?'k':''}">${w.w.replace(/[.,]$/,'')}</span>`).join('');}
 if(gi>=0){const g=groups[gi];[...caps.children].forEach((sp,k)=>{const w=g[k];const a=clamp((t-w.s+.04)/.09);sp.style.transform=`scale(${lerp(.82,1,back(a))})`;sp.style.opacity=t>=w.s-.04?1:.0;});}}
// ---------- render ----------
const grainEl=document.getElementById('grain'),chl=document.getElementById('chlabel'),flash=document.getElementById('flash');
const chapters=ST.scenes.map((s,i)=>s.type=='chapter'?i:-1).filter(i=>i>=0);
function fmt(n,dec){return dec?n.toFixed(dec):Math.round(n).toLocaleString('en-US')}
const FPS=30;const footEl=document.getElementById('foot'),footImg=document.getElementById('footimg'),footCap=document.getElementById('footcap');
function loadImg(img,src){if(img.dataset.src===src)return null;img.dataset.src=src;return new Promise(r=>{img.onload=r;img.onerror=r;img.src=src;});}
function fframe(clip,sec){const n=(window.FOOTN||{})[clip]||1;let k=Math.floor(sec*FPS);k=((k%n)+n)%n;return `footage/${clip}/f${String(k+1).padStart(4,'0')}.jpg`;}
window.render=function(t,frame){const waits=[];
 let fs=null;cards.forEach((c,i)=>{const F=c.s.footage;if(F&&t>=c.t0&&t<c.t0+F.dur)fs={c,F};});
 if(fs){const {c,F}=fs,lt=t-c.t0;footEl.style.opacity=1;const w=loadImg(footImg,fframe(F.clip,(F.from||0)+lt*(F.speed||1)));if(w)waits.push(w);
  footImg.style.transform=`scale(${1.12-0.08*easeOut(lt/F.dur)+0.02*lt})`;
  footCap.querySelector('.k').textContent=F.kicker||'Real footage';footCap.querySelector('.c').innerHTML=F.cap||'';
  footCap.style.opacity=clamp((lt-.25)/.3);footCap.style.transform=`rotate(-1.5deg) translateX(${lerp(-40,0,easeOut((lt-.25)/.4))}px)`;
  const cr=(window.FCRED||{})[F.clip];footCap.querySelector('.c').innerHTML=(F.cap||'')+(cr?`<div class="cr">Footage: ${cr}</div>`:'');}
 else{footEl.style.opacity=0;}
 document.querySelectorAll('.ph[data-video]').forEach(ph=>{const card=ph.closest('.card');if(card.style.visibility==='hidden')return;const c=cards.find(x=>x.el===card);
  const w=loadImg(ph.querySelector('.phv'),fframe(ph.dataset.video,Math.max(0,t-c.t0)));if(w)waits.push(w);});

 const cur=S.reduce((a,s,i)=>t>=s.start?i:a,0);const pose=camPose(t);
 for(const c of cards){const i=c.i;if(i>cur+0||(Math.abs(c.x-pose.x)>3600/pose.z&&i<cur-1)){c.el.style.visibility='hidden';continue;}c.el.style.visibility='visible';
  const u=i==0?1:clamp((t-c.t0)/.5),e=easeOut(u),odd=i%2;
  c.el.style.transform=`translate3d(${lerp((odd?1:-1)*300,0,e)}px,${lerp(-140,0,e)}px,${lerp(1000,0,e)+i*.5}px) rotate(${c.r+lerp(odd?-12:10,0,e)}deg)`;
  const dim=i<cur?clamp((t-S[i+1].start)/.6)*.42:0,sh=lerp(80,20,e);
  c.el.style.filter=`drop-shadow(0 ${sh}px ${sh*1.2}px rgba(0,0,0,${lerp(.25,.55,e)}))`+(dim?` brightness(${(1-dim).toFixed(3)})`:'');
  if(i<cur-1)continue;
  const sc=S[i];let anyHL=0;
  c.el.querySelectorAll('[data-hl]').forEach(e=>{const k=e.dataset.hl;if(sc.cues[k]===undefined)return;const s0=Math.max(sc.cues[k],(c.tv||c.t0)+.4);const d=clamp((sc.cues[k+'_end']-sc.cues[k])*1.05,.3,.75);
   const p=easeOut((t-s0+.05)/d);e.style.setProperty('--p',p.toFixed(4));if(p>0)anyHL=1;});
  const sheet=c.el.querySelector('.sheet');if(sheet&&c.s.type!='chapter')sheet.style.setProperty('--ink',(anyHL&&c.s.type!='verdict'&&c.s.type!='quote'?.42:1));
  c.el.querySelectorAll('.statrow').forEach(e=>{const s0=(i==0&&!c.s.footage)?-1:Math.max(sc.cues[e.id]??1e9,(c.tv||c.t0)+.35);const u=clamp((t-s0)/1.0);const n=+e.dataset.num;
   const dec=(String(e.dataset.num).split('.')[1]||'').length;e.querySelector('.num').textContent=e.dataset.pre+fmt(n*easeOut(u),dec)+e.dataset.suf;e.style.opacity=t>=s0-.2||u>0?1:.25;
   e.querySelector('.num').style.color=u>0&&u<1?'#c8231b':'#161412';e.querySelector('.num').style.transform=`scale(${u>=1?lerp(1.08,1,clamp((t-s0-1)/.25)):1})`;e.querySelector('.num').style.display='inline-block';});
  if(c.s.type=='quote'){const s0=sc.cues.qt??1e9;c.el.querySelectorAll('.quote-big .w').forEach((w,k)=>{const a=easeOut((t-s0-k*.12)/.3);w.style.opacity=a;w.style.transform=`translateY(${lerp(24,0,a)}px)`;});
   const ql=c.el.querySelector('.qline path'),L=ql.getTotalLength(),a=easeOut((t-(sc.cues.qt_end??1e9)-.1)/.45);ql.style.strokeDasharray=L;ql.style.strokeDashoffset=L*(1-a);ql.style.opacity=a>0?1:0;}
  if(c.s.type=='title'){const s0=sc.cues.cross;c.el.querySelectorAll('.xmark path').forEach((p,k)=>{const L=p.getTotalLength(),a=easeOut((t-s0-.25-k*.22)/.22);p.style.strokeDasharray=L;p.style.strokeDashoffset=L*(1-a);p.style.opacity=a>0?1:0;});}
  if(c.s.type=='map'){c.el.querySelectorAll('.leg').forEach(p=>{const s0=Math.max(sc.cues[p.dataset.cue],(c.tv||c.t0)+.4),a=ease((t-s0)/1.1);p.style.strokeDasharray=`${a*1600} 4000`;});
   c.el.querySelectorAll('.stop').forEach(g=>{const leg=c.s.legs.find(l=>l[1]==g.dataset.k);let a=1;if(leg){const s0=Math.max(sc.cues['leg_'+leg[1]],c.t0+.4)+1.0;a=back((t-s0)/.35);}g.style.opacity=a>0?1:0;g.style.transform=`scale(${Math.max(a,0)})`;g.style.transformOrigin='center';g.style.transformBox='fill-box';});}
  if(c.s.type=='chapter'){const a=back((t-c.t0-.05)/.45);c.el.querySelector('.sheet').style.transform=`scale(${lerp(1.5,1,a)})`;}
 }
 // camera
 const sh=Math.sin(t*1.3)*3+Math.sin(t*2.7)*2,sv=Math.cos(t*1.1)*3;

 // flash on chapter/title
 let fl=0;cards.forEach(c=>{if(c.s.footage){fl=Math.max(fl,c.t0>0.2?1-clamp(Math.abs(t-c.t0)/.1):0,1-clamp(Math.abs(t-c.t0-c.s.footage.dur)/.1));}});S.forEach((s,i)=>{if(ST.scenes[i].type=='chapter'||ST.scenes[i].type=='title'){fl=Math.max(fl,1-clamp(Math.abs(t-s.start-.08)/.12));}});flash.style.opacity=(fl*.55).toFixed(3);
 drawCaps(t);
 grainEl.style.backgroundImage=`url(grain${frame%6}.png)`;
 document.getElementById('flicker').style.opacity=(.05+.04*Math.sin(frame*1.9)*Math.sin(frame*.71)).toFixed(3);
 document.getElementById('stage').style.opacity=clamp((TL.total-t)/.6).toFixed(3);

};
