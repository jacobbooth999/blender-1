<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#050505;overflow:hidden}svg{display:block}text{font-family:Inter,sans-serif}</style>
</head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
/* ============ "THE 1% CLUB" — glowing monochrome line-art short ============ */
const W=1080,H=1920;
const TIMING=window.TIMING||{duration:40.85,lines:[]};
const L=TIMING.lines.map(l=>({s:l.start,e:l.end}));
const END=L[L.length-1].e+0.3;
window.VIDEO_END=END;

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,d)=>clamp((t-a)/d);
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.9;return x<=0?0:1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,u)=>a+(b-a)*u;

/* ---------- output + cues ---------- */
let out='',uid=0,T=0;
const add=s=>{out+=s};
const CUES=new Map();
function cue(type,t0,vol=1){const k=type+'@'+t0.toFixed(3);if(!CUES.has(k))CUES.set(k,{type,t:+t0.toFixed(3),vol});}

/* ---------- static defs ---------- */
function grainURL(seed){const c=document.createElement('canvas');c.width=540;c.height=960;const g=c.getContext('2d');const im=g.createImageData(540,960);
  let s=seed*9301+49297;for(let i=0;i<im.data.length;i+=4){s=(s*9301+49297)%233280;const v=s/233280*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}
  g.putImageData(im,0,0);return c.toDataURL('image/png');}
const GRAINS=[1,2,3,4].map(grainURL);
const DEFS=`<defs>
<radialGradient id="vig" cx="50%" cy="46%" r="72%"><stop offset="0" stop-color="#1b1b1b"/><stop offset=".55" stop-color="#0c0c0c"/><stop offset="1" stop-color="#030303"/></radialGradient>
<radialGradient id="edge" cx="50%" cy="50%" r="72%"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
<radialGradient id="bk"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.4" fill="#fff" fill-opacity=".075"/></pattern>
<linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".4" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient>
<linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0d0d" stop-opacity="1"/><stop offset=".75" stop-color="#0d0d0d" stop-opacity=".97"/><stop offset="1" stop-color="#0d0d0d" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowL" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="16" result="b1"/><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b2"/><feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>`;

/* ---------- primitives ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function g(attrs,fn){add(`<g ${attrs}>`);fn();add('</g>');}
function label(x,y,t,{size=22,op=.72,anchor='middle',weight=700,sp=.24,fill='#fff',glow=false}={}){
  add(`<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight}" letter-spacing="${size*sp}" fill="${fill}" fill-opacity="${op}" text-anchor="${anchor}" ${glow?'filter="url(#glowS)"':''}>${esc(t)}</text>`);}
function title(x,y,t,{size=120,sp=.05,op=1,anchor='middle'}={}){
  add(`<text x="${x}" y="${y}" font-size="${size}" font-weight="800" letter-spacing="${size*sp}" fill="#fff" fill-opacity="${op}" text-anchor="${anchor}" filter="url(#glowL)">${esc(t)}</text>`);}
function pillShape(x,y,t,{size=22,dark=false,pad=28}={}){
  const w=t.length*size*0.92+pad*2,h=size*2.1;
  if(dark){add(`<g filter="url(#glowS)"><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="#0a0a0a" stroke="#fff" stroke-opacity=".8" stroke-width="2"/></g>`);label(x,y+size*.36,t,{size,op:.95,weight:800,sp:.2});}
  else{add(`<g filter="url(#glow)"><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="#f4f4f4"/></g>`);label(x,y+size*.36,t,{size,op:1,weight:800,sp:.2,fill:'#0b0b0b'});}
  return w;}
/* animated wrappers */
function fadeIn(t0,fn,{d=.45,dy=22,outAt=null,outD=.3}={}){let p=eo(P(T,t0,d));if(outAt!=null)p*=1-P(T,outAt,outD);if(p<=0.001)return;g(`opacity="${p.toFixed(3)}" transform="translate(0,${((1-p)*dy).toFixed(2)})"`,fn);}
function pop(t0,x,y,fn,{d=.42,snd='pop',vol=1,outAt=null}={}){if(snd)cue(snd,t0,vol);const q=P(T,t0,d);if(q<=0)return;let o=Math.min(1,q*3);if(outAt!=null)o*=1-P(T,outAt,.25);if(o<=0.001)return;const s=back(q);
  g(`opacity="${o.toFixed(3)}" transform="translate(${x},${y}) scale(${s.toFixed(4)}) translate(${-x},${-y})"`,fn);}
function pill(t0,x,y,txt,o={}){pop(t0,x,y,()=>pillShape(x,y,txt,o),{outAt:o.outAt});}
function drawPath(d,p,{sw=4,op=1,glow='glow',dash=null,fill='none',cap='round'}={}){if(p<=0)return;
  if(dash){const id='c'+(uid++);const bb=pathBox(d);add(`<clipPath id="${id}"><rect x="${bb[0]-20}" y="-50" width="${(bb[2]-bb[0]+40)*p}" height="${H+100}"/></clipPath>`);
    add(`<path d="${d}" stroke="#fff" stroke-opacity="${op}" stroke-width="${sw}" fill="none" stroke-dasharray="${dash}" stroke-linecap="${cap}" clip-path="url(#${id})" ${glow?`filter="url(#${glow})"`:''}/>`);return;}
  if(glow){const n=d.match(/-?\d+(\.\d+)?/g).map(Number);let xs=[],ys=[];for(let i=0;i+1<n.length;i+=2){xs.push(n[i]);ys.push(n[i+1]);}
    if(Math.max(...xs)-Math.min(...xs)<1||Math.max(...ys)-Math.min(...ys)<1){add(`<path d="${d}" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="${(1-p).toFixed(4)}" stroke="#fff" stroke-opacity="${op*.35}" stroke-width="${sw*3}" fill="none" stroke-linecap="${cap}"/>`);glow=null;}}
  add(`<path d="${d}" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="${(1-p).toFixed(4)}" stroke="#fff" stroke-opacity="${op}" stroke-width="${sw}" fill="${fill}" stroke-linecap="${cap}" stroke-linejoin="round" ${glow?`filter="url(#${glow})"`:''}/>`);}
function pathBox(d){const n=d.match(/-?\d+(\.\d+)?/g).map(Number);let xs=[];for(let i=0;i<n.length;i+=2)xs.push(n[i]);return[Math.min(...xs),0,Math.max(...xs),0];}
function ground(y,p=1,{op=.55,x1=-10,x2=W+10,dash=true}={}){if(p<=0)return;const id='c'+(uid++);
  add(`<clipPath id="${id}"><rect x="${x1}" y="${y-10}" width="${(x2-x1)*p}" height="20"/></clipPath><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#fff" stroke-opacity="${op}" stroke-width="2.5" ${dash?'stroke-dasharray="12 9"':''} clip-path="url(#${id})"/>`);}
function spotlight(x,gy,s=1,op=1){const top=gy-620*s,wt=40*s,wb=135*s;
  add(`<g opacity="${op}"><g filter="url(#blur12)"><polygon points="${x-wt},${top} ${x+wt},${top} ${x+wb},${gy} ${x-wb},${gy}" fill="url(#cone)"/></g><ellipse cx="${x}" cy="${gy+4}" rx="${120*s}" ry="${22*s}" fill="url(#bk)" fill-opacity=".14"/></g>`);}
function person(x,gy,s=1,{arm=null,arm2=null,arms=true,op=1,ring=true,spot=false,bob=0}={}){
  if(spot)spotlight(x,gy,s,typeof spot==='number'?spot:1);
  if(ring)add(`<ellipse cx="${x}" cy="${gy+4}" rx="${62*s}" ry="${13*s}" fill="none" stroke="#fff" stroke-opacity="${.35*op}" stroke-width="2" stroke-dasharray="7 6"/>`);
  const by=gy-bob,bw=32*s,bh=78*s,r=30*s,shY=by-bh+22*s;
  let p=`<g ${s>.5?'filter="url(#glow)"':'filter="url(#glowS)"'} opacity="${op}">`;
  p+=`<path d="M${x-bw},${by} L${x-bw},${by-bh+r} Q${x-bw},${by-bh} ${x-bw+r},${by-bh} L${x+bw-r},${by-bh} Q${x+bw},${by-bh} ${x+bw},${by-bh+r} L${x+bw},${by} Z" fill="#efefef"/>`;
  p+=`<circle cx="${x}" cy="${by-bh-34*s}" r="${25*s}" fill="#efefef"/>`;
  // two arms: a posed arm (arm=[dx,dy] from the shoulder line) and the other hanging at the side unless arm2 is given
  const limb=(side,[ax,ay])=>{const sx=x+side*bw*.62,ex=x+ax*s,ey=shY+ay*s,mx=(sx+ex)/2+side*7*s,my=(shY+ey)/2;
    const d=`M${sx.toFixed(1)},${shY.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`;
    return `<path d="${d}" stroke="#0b0b0b" stroke-width="${(13*s+5).toFixed(1)}" stroke-linecap="round" fill="none"/><path d="${d}" stroke="#efefef" stroke-width="${(13*s).toFixed(1)}" stroke-linecap="round" fill="none"/>`;};
  if(arms){const side=arm?Math.sign(arm[0]||1):1;
    p+=limb(side,arm||[40,58]);
    p+=limb(-side,arm2||[-side*40,58]);}
  add(p+'</g>');}
function orb(x,y,r=7,op=1){add(`<g opacity="${op}"><circle cx="${x}" cy="${y}" r="${r*6}" fill="url(#bk)" fill-opacity=".18"/><circle cx="${x}" cy="${y}" r="${r}" fill="#fff" filter="url(#glow)"/></g>`);}
function bokeh(list,drift=0){list.forEach(([x,y,r,o],i)=>add(`<circle cx="${x+Math.sin(drift*.3+i)*20}" cy="${y+Math.cos(drift*.25+i*2)*16}" r="${r}" fill="url(#bk)" fill-opacity="${o}"/>`));}
function box(x,y,w,h,{r=18,op=.85,sw=2.5,fill='#0a0a0a',dash=false,glow=true}={}){
  add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="#fff" stroke-opacity="${op}" stroke-width="${sw}" ${dash?'stroke-dasharray="10 8"':''} ${glow?'filter="url(#glowS)"':''}/>`);}
function cross(x,y,s=1,op=.9,p=1){if(p<=0)return;const a=clamp(p*2),b=clamp(p*2-1);
  add(`<g stroke="#fff" stroke-opacity="${op}" stroke-width="${5*s}" stroke-linecap="round" filter="url(#glowS)"><line x1="${x-s*20}" y1="${y-s*20}" x2="${x-s*20+40*s*a}" y2="${y-s*20+40*s*a}"/>${b>0?`<line x1="${x+s*20}" y1="${y-s*20}" x2="${x+s*20-40*s*b}" y2="${y-s*20+40*s*b}"/>`:''}</g>`);}
function qmark(x,y,size=56,op=1){add(`<text x="${x}" y="${y}" font-size="${size}" font-weight="800" fill="#fff" fill-opacity="${op}" text-anchor="middle" filter="url(#glowL)">?</text>`);}

/* ============ LIBRARY — landscape long-form helpers ============ */

const CX=1130, G=870, FX=330;          // stage centre (right of the figure), ground line, figure x
const at=(i,o=0)=>L[i].s+o, atE=(i,o=0)=>L[i].e+o;
const BK=[[260,240,170,.05],[1680,820,210,.045],[1500,180,110,.04],[180,900,140,.035]];

/* ---------- small primitives ---------- */
function check(x,y,s=1,op=1){add(`<g filter="url(#glowS)" opacity="${op}"><circle cx="${x}" cy="${y}" r="${18*s}" fill="#f4f4f4"/><path d="M${x-8*s},${y} l${6*s},${6*s} l${10*s},${-12*s}" stroke="#0a0a0a" stroke-width="${4*s}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`);}
function personOutline(x,gy,s=1,op=1){const bw=32*s,bh=78*s,r=30*s;
  add(`<g opacity="${op}" filter="url(#glow)" fill="none" stroke="#fff" stroke-width="3.5" stroke-dasharray="9 7"><path d="M${x-bw},${gy} L${x-bw},${gy-bh+r} Q${x-bw},${gy-bh} ${x-bw+r},${gy-bh} L${x+bw-r},${gy-bh} Q${x+bw},${gy-bh} ${x+bw},${gy-bh+r} L${x+bw},${gy}"/><circle cx="${x}" cy="${gy-bh-34*s}" r="${25*s}"/></g>`);}
function strike(x1,x2,y,p){if(p>0)add(`<line x1="${x1}" y1="${y}" x2="${lerp(x1,x2,eo(Math.min(1,p)))}" y2="${y}" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`);}
function spinner(x,y,r=14,op=.8){const a=T*6;add(`<path d="M${x+r*Math.cos(a)},${y+r*Math.sin(a)} A${r},${r} 0 1 1 ${x+r*Math.cos(a+4.4)},${y+r*Math.sin(a+4.4)}" stroke="#fff" stroke-opacity="${op}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`);}
function zzz(x,y,op=.7){[0,1,2].forEach(i=>{const ph=((T*.8+i/3)%1);add(`<text x="${x+i*16+ph*10}" y="${y-i*26-ph*20}" font-size="${22+i*6}" font-weight="800" fill="#fff" fill-opacity="${op*Math.sin(ph*Math.PI)}">Z</text>`);});}
function bubble(x,y,w,txt,{size=18,dark=true,tail='left'}={}){const tx=tail==='left'?x-w/2+30:x+w/2-30,d=tail==='left'?1:-1;
  add(`<g filter="url(#glowS)" fill="#0b0b0b" stroke="#fff" stroke-width="3"><circle cx="${tx-d*18}" cy="${y+66}" r="7"/><circle cx="${tx}" cy="${y+44}" r="10"/><rect x="${x-w/2}" y="${y-40}" width="${w}" height="76" rx="38"/></g>`);label(x,y+5,txt,{size,op:.92,weight:800,sp:.14});}
function ring(x,y,t0,{r0=60,r1=260,d=.8,op=.6}={}){const p=P(T,t0,d);if(p>0&&p<1)add(`<circle cx="${x}" cy="${y}" r="${r0+(r1-r0)*eo(p)}" fill="none" stroke="#fff" stroke-opacity="${op*(1-p)}" stroke-width="3" filter="url(#glowS)"/>`);}
function arrowR(x1,y,x2,p,op=.7){if(p<=0)return;const x=lerp(x1,x2,eo(p));add(`<line x1="${x1}" y1="${y}" x2="${x}" y2="${y}" stroke="#fff" stroke-opacity="${op}" stroke-width="4" stroke-dasharray="10 9"/>`);if(p>.9)add(`<path d="M${x-16},${y-14} L${x},${y} L${x-16},${y+14}" stroke="#fff" stroke-opacity="${op}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);}
function xTile(x,y,s=60,op=.9){add(`<g opacity="${op}"><rect x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" rx="${s*.18}" fill="#0b0b0b" stroke="#fff" stroke-width="3" filter="url(#glowS)"/></g>`);cross(x,y,s/80,op,1);}

/* ---------- icons (≈ ±40 units at s=1) ---------- */
function icon(n,x,y,s=1,op=1){const k=s;let d='';const st=`stroke="#fff" stroke-width="${4*k}" fill="#0b0b0b" stroke-linecap="round" stroke-linejoin="round"`;
  switch(n){
  case 'dumbbell':d=`<line x1="${x-30*k}" y1="${y}" x2="${x+30*k}" y2="${y}"/><rect x="${x-42*k}" y="${y-22*k}" width="${13*k}" height="${44*k}" rx="${4*k}"/><rect x="${x+29*k}" y="${y-22*k}" width="${13*k}" height="${44*k}" rx="${4*k}"/><rect x="${x-53*k}" y="${y-13*k}" width="${11*k}" height="${26*k}" rx="${4*k}"/><rect x="${x+42*k}" y="${y-13*k}" width="${11*k}" height="${26*k}" rx="${4*k}"/>`;break;
  case 'book':d=`<path d="M${x},${y-22*k} C ${x-14*k},${y-32*k} ${x-36*k},${y-32*k} ${x-46*k},${y-26*k} L${x-46*k},${y+28*k} C ${x-36*k},${y+22*k} ${x-14*k},${y+22*k} ${x},${y+32*k} Z"/><path d="M${x},${y-22*k} C ${x+14*k},${y-32*k} ${x+36*k},${y-32*k} ${x+46*k},${y-26*k} L${x+46*k},${y+28*k} C ${x+36*k},${y+22*k} ${x+14*k},${y+22*k} ${x},${y+32*k} Z"/>`;break;
  case 'phone':d=`<rect x="${x-24*k}" y="${y-40*k}" width="${48*k}" height="${80*k}" rx="${9*k}"/><line x1="${x-12*k}" y1="${y-22*k}" x2="${x+12*k}" y2="${y-22*k}"/><line x1="${x-12*k}" y1="${y-8*k}" x2="${x+6*k}" y2="${y-8*k}"/><line x1="${x-12*k}" y1="${y+6*k}" x2="${x+12*k}" y2="${y+6*k}"/>`;break;
  case 'dollar':d=`<circle cx="${x}" cy="${y}" r="${38*k}"/><text x="${x}" y="${y+18*k}" font-size="${52*k}" font-weight="800" fill="#fff" stroke="none" text-anchor="middle">$</text>`;break;
  case 'pound':d=`<circle cx="${x}" cy="${y}" r="${38*k}"/><text x="${x}" y="${y+18*k}" font-size="${50*k}" font-weight="800" fill="#fff" stroke="none" text-anchor="middle">£</text>`;break;
  case 'trophy':d=`<path d="M${x-26*k},${y-36*k} L${x+26*k},${y-36*k} L${x+22*k},${y} Q${x},${y+16*k} ${x-22*k},${y} Z"/><path d="M${x-26*k},${y-28*k} Q${x-46*k},${y-26*k} ${x-38*k},${y-8*k} Q${x-32*k},${y} ${x-20*k},${y-4*k}" fill="none"/><path d="M${x+26*k},${y-28*k} Q${x+46*k},${y-26*k} ${x+38*k},${y-8*k} Q${x+32*k},${y} ${x+20*k},${y-4*k}" fill="none"/><line x1="${x}" y1="${y+10*k}" x2="${x}" y2="${y+26*k}"/><rect x="${x-20*k}" y="${y+26*k}" width="${40*k}" height="${12*k}" rx="${3*k}"/>`;break;
  case 'clock':d=`<circle cx="${x}" cy="${y+4*k}" r="${34*k}"/><line x1="${x}" y1="${y+4*k}" x2="${x}" y2="${y-16*k}"/><line x1="${x}" y1="${y+4*k}" x2="${x+14*k}" y2="${y+12*k}"/><path d="M${x-34*k},${y-26*k} l${14*k},${-12*k} M${x+34*k},${y-26*k} l${-14*k},${-12*k}"/>`;break;
  case 'calendar':d=`<rect x="${x-38*k}" y="${y-32*k}" width="${76*k}" height="${70*k}" rx="${8*k}"/><line x1="${x-38*k}" y1="${y-12*k}" x2="${x+38*k}" y2="${y-12*k}"/><line x1="${x-20*k}" y1="${y-42*k}" x2="${x-20*k}" y2="${y-24*k}"/><line x1="${x+20*k}" y1="${y-42*k}" x2="${x+20*k}" y2="${y-24*k}"/>`+[0,1,2].map(i=>[0,1].map(j=>`<rect x="${x-26*k+i*20*k}" y="${y+k*(0+j*16)}" width="${10*k}" height="${8*k}" rx="${2*k}" fill="#fff" stroke="none"/>`).join('')).join('');break;
  case 'target':d=`<circle cx="${x}" cy="${y}" r="${38*k}"/><circle cx="${x}" cy="${y}" r="${24*k}"/><circle cx="${x}" cy="${y}" r="${9*k}" fill="#fff"/>`;break;
  case 'gear':{let p='';for(let i=0;i<16;i++){const a=i*Math.PI/8,r=i%2?26*k:36*k;p+=(i?'L':'M')+(x+r*Math.cos(a)).toFixed(1)+','+(y+r*Math.sin(a)).toFixed(1);}d=`<path d="${p}Z"/><circle cx="${x}" cy="${y}" r="${10*k}"/>`;break;}
  case 'bulb':d=`<path d="M${x-20*k},${y+16*k} C ${x-44*k},${y-4*k} ${x-36*k},${y-52*k} ${x},${y-54*k} C ${x+36*k},${y-52*k} ${x+44*k},${y-4*k} ${x+20*k},${y+16*k} L${x+18*k},${y+30*k} L${x-18*k},${y+30*k} Z"/><line x1="${x-14*k}" y1="${y+42*k}" x2="${x+14*k}" y2="${y+42*k}"/>`;break;
  case 'play':d=`<rect x="${x-42*k}" y="${y-30*k}" width="${84*k}" height="${60*k}" rx="${10*k}"/><path d="M${x-10*k},${y-14*k} L${x+16*k},${y} L${x-10*k},${y+14*k} Z" fill="#fff"/>`;break;
  case 'note':d=`<path d="M${x-14*k},${y+24*k} L${x-14*k},${y-30*k} L${x+24*k},${y-38*k} L${x+24*k},${y+16*k}" fill="none"/><ellipse cx="${x-24*k}" cy="${y+24*k}" rx="${11*k}" ry="${8*k}" fill="#fff"/><ellipse cx="${x+14*k}" cy="${y+16*k}" rx="${11*k}" ry="${8*k}" fill="#fff"/>`;break;

function hookScene(t,frozen){const by=1150,mx=540;const tt=frozen?0:t;
  // dashed CEO door that everyone passes
  const dp=frozen?1:P(t,1.5,.4);add(`<g opacity="${dp}"><rect x="${mx+190}" y="380" width="200" height="300" rx="10" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="14 10" filter="url(#glowS)"/>`);label(mx+290,350,'CEO',{size:30,op:1,weight:900,sp:.12});add('</g>');
  belt(by,tt);
  for(let k=0;k<6;k++){const x=((k*210+tt*180+20)%1260)-140;const out=x>mx+150;const op=x>mx-150&&x<mx+150?0:1;
    person(x,by,.65,{ring:false,op,arm:out?[30,40]:null,arm2:out?[-30,40]:null});if(out){badge(x,by-80,.9);}}
  machine(mx,by,tt);
  // the EMPLOYEE stamp slams down at 0.6 s on the first one out
  const sp=frozen?1:back(P(t,.55,.25));const stx=mx+300;if(sp>0)g(`transform="translate(${stx},860) rotate(-10) scale(${frozen?1:lerp(2.2,1,clamp(P(t,.55,.18)))}) translate(${-stx},-860)" opacity="${Math.min(1,sp)}"`,()=>{add(`<rect x="${stx-200}" y="800" width="400" height="120" rx="14" fill="none" stroke="#fff" stroke-width="9" filter="url(#glow)"/>`);bigText(stx,885,'EMPLOYEE',64);});}

/* ---------- segments ---------- */
function stage(vs,t,k,reset){const cx=540;ground(SG,1,{op:.45});
  if(vs===0||reset){hookScene(reset?0:t,reset);return;}
  if(vs===1){bigText(cx,640,'THINK',140);bigText(cx,770,'ABOUT IT.',110);person(cx,SG,1.1,{spot:true,arm:[14,-34]});return;}
  if(vs>=2&&vs<=4){// classroom rows
    const hand=t>l(2)+.75&&t<l(2)+1.6;for(let r=0;r<2;r++)for(let c=0;c<4;c++){const x=200+c*230,g=980+r*230;desk(x,g,1.1);person(x,g-10,.62,{ring:false,arm:hand&&vs===2?[20,-90]:null,op:.85});}
    if(vs===2){['SIT DOWN.','RAISE YOUR HAND.','WAIT FOR THE BELL.'].forEach((s,j)=>pill(l(2)+[0,.7,1.4][j],cx,430+j*80,s,{size:24,dark:j<2}));const sh=t>l(2)+1.4?Math.sin(t*50)*6:0;icon('clock',900+sh,300,1);cue('tick',l(2)+1.5,.6);cue('tick',l(2)+1.65,.6);}
    if(vs===3){pill(k+.1,cx,470,'FOLLOW INSTRUCTIONS',{size:26});const st=back(P(t,k+1.2,.35));if(st>0)g(`transform="translate(430,700) scale(${st}) translate(-430,-700)"`,()=>{icon('star',430,700,1.6);label(430,790,'GOLD STAR',{size:20,op:.9,weight:900});});cue('win',k+1.2,.5);}
    if(vs===4){add(`<rect x="320" y="400" width="440" height="380" rx="14" fill="#0b0b0b" stroke="#fff" stroke-width="4" filter="url(#glowS)"/>`);label(cx,450,'TEST',{size:22,op:.7,weight:900});[0,1,2].forEach(j=>add(`<line x1="360" y1="${510+j*60}" x2="${600}" y2="${510+j*60}" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>`));
      cross(680,570,1.2,.95,P(t,k+.5,.25));pop(k+.9,cx,730,()=>bigText(cx,750,'-10',80),{snd:'nope',vol:.5});}
    return;}
  if(vs===5){for(let r=0;r<2;r++)for(let c=0;c<4;c++){const x=200+c*230,g=980+r*230;add(`<rect x="${x-90}" y="${g-150}" width="180" height="150" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>`);person(x,g-10,.62,{ring:false,op:.85});badge(x,g-80,.8);}
    pill(k+.3,cx,560,'PERFECT EMPLOYEE',{size:28,dark:true});return;}
  if(vs===6){bigText(cx,560,'A CEO NEEDS',96);bigText(cx,680,'THE OPPOSITE',96);const r=eio(P(t,k+.4,.6));g(`transform="rotate(${r*180},${cx},850)"`,()=>{add(`<path d="M${cx-90},850 a90,90 0 1 1 90,90" fill="none" stroke="#fff" stroke-width="7" filter="url(#glowS)"/><path d="M${cx-20},925 l20,15 l-20,15" stroke="#fff" stroke-width="7" fill="none"/>`);});person(cx,SG,1.05,{spot:true});return;}
  if(vs===7){const gx=440,gw=220;add(`<path d="M-20,${SG} L${gx},${SG} L${gx},${SG+300}" fill="none" stroke="#fff" stroke-width="4"/><path d="M${gx+gw},${SG+300} L${gx+gw},${SG} L1100,${SG}" fill="none" stroke="#fff" stroke-width="4"/>`);
    const j=P(t,k+.2,.7);const[px,py]=j<=0?[300,SG]:hopTo(300,SG,800,SG,eio(j),260);person(px,py,1,{spot:.7,ring:false,arm:j>0&&j<1?[50,-80]:null,arm2:j>0&&j<1?[-50,-80]:null});pill(k+.1,cx,520,'RISK',{size:32});cue('whoosh',k+.2,.6);return;}
  if(vs===8){const pts=[[200,1050],[330,980],[420,1120],[540,880],[620,1000],[760,720],[880,640]];const tip=polyline(pts,P(t,k+.1,1.4),{sw:6});if(tip)orb(tip[0],tip[1],8);
    if(t>k+.6)cross(420,1150,.7,.8,1);if(t>k+1.0)cross(620,1030,.7,.8,1);if(t>k+1.4)check(880,600,1.4);pill(k+.3,cx,480,'FAIL FAST. LEARN.',{size:28});return;}
  if(vs===9){person(cx,SG,1.1,{spot:true,arm:[26,-80]});pop(k+.2,cx,620,()=>bigText(cx,660,'WHY?',170),{snd:'hit',vol:.6});
    pop(k+1.0,cx,860,()=>{pillShape(cx,860,'WAITING FOR INSTRUCTIONS',{size:22,dark:true});strike(cx-300,cx+300,860,P(t,k+1.4,.3));},{vol:.4});return;}
  if(vs===10){const x0=200,y0=420;for(let r=0;r<4;r++)for(let c=0;c<5;c++)add(`<rect x="${x0+c*136}" y="${y0+r*70}" width="128" height="62" rx="6" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2.5"/>`);label(cx,400,'TIMETABLE',{size:20,op:.7,weight:900});
    cross(cx,560,3,.9,P(t,k+.6,.3));drawPath(`M120,${SG-20} C 300,${SG-200} 500,${SG+20} 700,${SG-140} S 960,${SG-60} 1040,${SG-200}`,eo(P(t,k+.4,1.4)),{sw:4,dash:'12 10',glow:'glowS'});
    const u=clamp((t-k-.4)/1.4);person(lerp(120,960,u),SG,.9,{spot:.6,ring:false,bob:Math.abs(Math.sin(t*14))*6});return;}
  if(vs===11){icon('house',380,700,2.4);label(380,830,'SCHOOL',{size:22,op:.85,weight:900});check(470,600,1.4*back(P(t,k+.4,.3)));
    add(`<rect x="640" y="580" width="260" height="260" rx="20" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="14 10"/>`);label(770,720,'?',{size:80,op:.8,weight:900,sp:0});label(770,880,'THE REST',{size:22,op:.85,weight:900});
    person(cx,SG,1,{spot:.6});return;}
  if(vs===12){icon('moon',860,420,1,.6);icon('book',cx+30,SG-210,1);person(cx-60,SG,1.1,{spot:true,arm:[60,-40]});[0,1,2].forEach(j=>pop(k+.4+j*.4,360+j*180,560,()=>icon('bulb',360+j*180,560,.9),{snd:'pop',vol:.35}));pill(k+.2,cx,420,'TEACH YOURSELF',{size:28});return;}
  if(vs===13||vs===14){person(cx,SG,1.05,{spot:true,arm:[44,-80]});[['dollar','MONEY',0],['handshake','SELLING',.65],['gear','BUILDING',1.3]].forEach(([ic,tx,d],j)=>{const x=220+j*320;pop(l(13)+d,x,640,()=>{box(x-140,500,280,290,{r:24,op:.95});icon(ic,x,610,1.3);label(x,740,tx,{size:24,op:1,weight:900});},{snd:'hit',vol:.45});});return;}}

/* ---------- main ---------- */
S.push({s:0,e:END+1,cam:{zoom:0},draw:()=>{
  const t=T,seg=segAt(t),k=SEG[seg];const reset=seg===NL-1&&t>resetAt;const vs=reset?0:seg;
  const punch=1+.04*(1-eo(P(t,k,.35)));const sh=P(t,.55,.3),am=sh>0&&sh<1?(1-sh)*22:0;
  add(`<circle cx="540" cy="700" r="480" fill="url(#bk)" fill-opacity=".05"/>`);
  g(`transform="translate(${540+Math.sin(t*90)*am},${800+Math.cos(t*80)*am}) scale(${punch}) translate(-540,-800)"`,()=>stage(vs,t,k,reset));
  const so=reset?P(t,resetAt,.2):1-P(t,2.9,.3);if(so>0)add(`<g opacity="${so}"><rect x="90" y="140" width="900" height="110" rx="55" fill="#fff" filter="url(#glow)"/><text x="540" y="217" font-size="52" font-weight="900" letter-spacing="2" text-anchor="middle" fill="#000">SCHOOL WON'T TELL YOU THIS</text></g>`);
  label(1040,58,'THE NEXT VERSION',{size:16,op:.45,anchor:'end',weight:800});
  const hb=t<le(0)+.1?1:(reset?P(t,resetAt,.15):0);
  if(hb>0){add(`<g opacity="${hb}"><rect x="0" y="1335" width="1080" height="190" fill="#fff" filter="url(#glow)"/><text x="540" y="1458" font-size="70" font-weight="900" letter-spacing="1" text-anchor="middle" fill="#000">SCHOOL MAKES WORKERS</text></g>`);}
  else captions(t);
  const fl=1-P(t,k,.12);if(seg>0&&fl>0&&!reset)add(`<rect width="${W}" height="${H}" fill="#fff" opacity="${fl*.12}"/>`);
  if(t>.55&&t<.68)add(`<rect width="${W}" height="${H}" fill="#fff" opacity="${(1-P(t,.55,.13))*.35}"/>`);
  if(seg>0)cue('whoosh',k,.4);cue('hit',0,.6);for(let j=0;j<5;j++)cue('tick',.05+j*.1,.3);cue('thunk',.55,1);cue('impact',.55,.8);cue('pop',1.5,.5);cue('whoosh',resetAt,.4);
}});

/* ============ RENDER ============ */
function render(t,dry=false){
  T=t;out='';uid=0;
  add(`<rect width="${W}" height="${H}" fill="url(#vig)"/><rect width="${W}" height="${H}" fill="url(#dots)"/>`);
  const X=.2;
  for(const sc of S){
    if(t<sc.s-X||t>sc.e+X)continue;
    let o=1;const first=sc===S[0],last=sc===S[S.length-1];
    if(!first)o=Math.min(o,P(t,sc.s-X,2*X));
    if(!last)o=Math.min(o,1-P(t,sc.e-X,2*X));
    if(o<=0)continue;
    if(!first)cue('whoosh',sc.s-X,.8);
    const u=clamp((t-sc.s)/(sc.e-sc.s+.001));
    const enter=first?0:(1-eo(P(t,sc.s-X,.7)));
    const z=1+(sc.cam.zoom||.03)*eio(u)+.035*enter;
    const fx=sc.cam.fx||540,fy=sc.cam.fy||940;
    add(`<g opacity="${o.toFixed(3)}" transform="translate(${fx},${fy}) scale(${z.toFixed(5)}) translate(${-fx},${-fy})">`);
    sc.draw(t-sc.s);add('</g>');
  }
  add(`<image href="${GRAINS[Math.floor(t*15)%4]}" width="${W}" height="${H}" opacity=".055" style="mix-blend-mode:screen" preserveAspectRatio="none"/>`);
  add(`<rect width="${W}" height="${H}" fill="url(#edge)"/>`);
  const fin=0;if(fin>0)add(`<rect width="${W}" height="${H}" fill="#000" opacity="${fin}"/>`);
  const fin0=0;if(fin0>0)add(`<rect width="${W}" height="${H}" fill="#000" opacity="${fin0}"/>`);
  if(!dry)document.getElementById('s').innerHTML=DEFS+out;
}
window.render=render;
window.collectCues=(fps=30)=>{CUES.clear();for(let f=0;f<=END*fps;f++)render(f/fps,true);return[...CUES.values()].sort((a,b)=>a.t-b.t);};
render(+(location.hash.slice(1)||1.5));
</script></body></html>
