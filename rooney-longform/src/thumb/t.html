<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@700&display=block" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden}
.v{position:absolute;inset:0;display:none;overflow:hidden}
.cut{position:absolute;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 18px 30px rgba(0,0,0,.7))}
.big{font-family:'Anton';line-height:.88;text-transform:uppercase}
.stroke{-webkit-text-stroke:10px #0b0b0d;paint-order:stroke fill}
.tag{position:absolute;font-family:'Oswald';font-weight:700;color:#fff;background:#c8231b;padding:2px 16px;box-shadow:0 10px 20px rgba(0,0,0,.5)}
</style></head><body>
<div class="v" id="A">
 <div style="position:absolute;inset:0;background:radial-gradient(circle at 25% 40%,#ff5a4a 0,#b3121b 40%,#3a0306 85%)"></div>
 <div style="position:absolute;inset:0;background:radial-gradient(circle at 78% 45%,#6b7a8c 0,#2a3340 45%,#0b0e13 85%);clip-path:polygon(58% 0,100% 0,100% 100%,44% 100%)"></div>
 <div style="position:absolute;inset:0;clip-path:polygon(57.4% 0,58.6% 0,45.2% 100%,44% 100%);background:#fff"></div>
 <img class="cut" src="utd3_cut.png" style="left:-190px;top:90px;height:1000px">
 <img class="cut" src="dc2_cut.png" style="right:-90px;top:60px;height:820px;filter:grayscale(.85) contrast(1.1) drop-shadow(0 0 3px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 18px 30px rgba(0,0,0,.7))">
 <div class="big stroke" style="position:absolute;left:420px;top:24px;font-size:124px;color:#fff;text-align:center;transform:rotate(-4deg)">FORGOTTEN<br><span style="color:#ffd61e">LEGEND?</span></div>
 <div class="tag" style="left:36px;bottom:36px;font-size:46px;transform:rotate(-3deg)">253 GOALS</div>
</div>
<div class="v" id="B">
 <div style="position:absolute;inset:0;background:#262a33 url(desk.jpg);background-size:900px"></div>
 <div style="position:absolute;left:40px;top:50px;width:760px;height:620px;background:#eee6d4 url(paper.jpg);background-size:700px;transform:rotate(-2deg);box-shadow:0 30px 50px rgba(0,0,0,.7)"></div>
 <img class="cut" src="dc2_cut.png" style="right:-40px;top:30px;height:780px">
 <div class="big" style="position:absolute;left:80px;top:80px;font-size:122px;line-height:1.08;color:#161412;transform:rotate(-2deg)">REMEMBER<br>THE <span style="background:linear-gradient(100deg,transparent,#ffd61e 3%,#ffd61e 97%,transparent);padding:0 14px">NAME</span></div>
 <svg style="position:absolute;left:90px;top:440px;width:600px;height:50px;transform:rotate(-2deg)" viewBox="0 0 600 50" preserveAspectRatio="none"><path d="M5 35 C 180 10, 420 45, 595 18" stroke="#c8231b" stroke-width="14" fill="none" stroke-linecap="round"/></svg>
 <div class="tag" style="left:90px;top:520px;font-size:50px;transform:rotate(-3deg)">UNITED'S RECORD SCORER</div>
</div>
</body></html>
